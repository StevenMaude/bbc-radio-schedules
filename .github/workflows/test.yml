name: Lint code and run tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Run linters
        if: matrix.python-version == '3.13'
        run: uv run black --check .

      - name: Run tests
        run: uv run python -m unittest discover tests/

      - name: Check package installs
        run: python -m pip install .

      - name: Check CLI output
        run: |
          uv run bbcradio_cli stations | grep -F "BBC Radio 2 https://www.bbc.co.uk/sounds/schedules/bbc_radio_two"
          uv run bbcradio_cli schedule "BBC Radio 2" "$(date -u +%F)" | grep -F "Schedule for BBC Radio 2 on"

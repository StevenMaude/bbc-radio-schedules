name: Lint code and run tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync

    - name: Run linter
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Run unit tests
      run: uv run python -m pytest tests/test_api.py -v

    - name: Run functional tests
      run: uv run python -m pytest tests/test_functional.py -v

    - name: Check package installs
      run: uv pip install .

    - name: Check stations output
      run: test "$(uv run bbcradio_cli stations | wc -l)" -ge 50

    - name: Check schedule data retrieval
      run: test "$(uv run bbcradio_cli schedule 'BBC Radio 2' '2021-01-30' | wc -l)" -ge 70

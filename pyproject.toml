[project]
name = "bbcradio"
version = "0.2.0"
description = "Unofficial API for BBC radio station schedules"
authors = [{ name = "Steven Maude", email = "git@stevenmaude.co.uk" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["bbc", "radio", "schedule"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "requests>=2.32",
    "lxml>=5.3",
]

[project.urls]
Repository = "https://github.com/StevenMaude/bbc-radio-schedules"

[project.scripts]
bbcradio_cli = "bbcradio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "ruff>=0.9",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

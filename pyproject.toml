[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bbcradio"
version = "0.2.0"
description = "Unofficial API for BBC radio station schedules"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Steven Maude", email = "git@stevenmaude.co.uk" }]
keywords = ["bbc", "radio", "schedule"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "lxml>=6.1.1,<7",
    "requests>=2.34.2,<3",
]

[project.urls]
Repository = "https://github.com/StevenMaude/bbc-radio-schedules"

[project.scripts]
bbcradio = "bbcradio.cli:main"
bbcradio_cli = "bbcradio.cli:main"

[dependency-groups]
dev = [
    "black>=26.5.1,<27",
]

[tool.black]
line-length = 79
target-version = ["py311", "py312", "py313"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["bbcradio*"]

[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bbcradio"
version = "0.2.0"
description = "Unofficial API for BBC radio station schedules"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Steven Maude", email = "git@stevenmaude.co.uk" }]
keywords = ["bbc", "radio", "schedule"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = ["requests>=2.31,<3"]

[project.urls]
Homepage = "https://github.com/StevenMaude/bbc-radio-schedules"
Repository = "https://github.com/StevenMaude/bbc-radio-schedules"

[project.scripts]
bbcradio_cli = "bbcradio.cli:main"

[dependency-groups]
dev = ["black>=24.4.2,<25"]

[tool.setuptools]
packages = ["bbcradio"]

[tool.black]
line-length = 79
target-version = ["py311", "py312", "py313"]

[tool.uv]
default-groups = ["dev"]
